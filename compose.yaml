name: reliability-lab

x-app: &app
  build: .
  image: reliability-lab-app:local
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  environment:
    DATABASE_URL: postgresql://lab:lab@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/lab
    REDIS_URL: redis://redis:6379/0
    CACHE_ENABLED: ${CACHE_ENABLED:-true}
    CACHE_TTL: ${CACHE_TTL:-60}
    WEB_WORKERS: ${WEB_WORKERS:-1}
    EXPECTED_REPLICAS: ${REPLICAS:-3}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-16}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-1}
    REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5}
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 20s
  stop_grace_period: 30s
  ulimits:
    nofile:
      soft: ${NOFILE:-65536}
      hard: ${NOFILE:-65536}
  sysctls:
    net.core.somaxconn: ${SOMAXCONN:-4096}

services:
  app:
    <<: *app
    scale: ${REPLICAS:-3}

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab_admin
      POSTGRES_DB: lab
    command: [postgres, -c, max_connections=120, -c, shared_buffers=128MB, -c, statement_timeout=4000]
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 10

  pgbouncer:
    build: infra/pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=lab psql -h 127.0.0.1 -p 6432 -U lab -d lab -Atc 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.28-alpine
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      NGINX_KEEPALIVE: ${NGINX_KEEPALIVE:-128}
      NGINX_CONNECTIONS: ${NGINX_CONNECTIONS:-8192}
      NGINX_PROXY_TIMEOUT: ${NGINX_PROXY_TIMEOUT:-6s}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"]
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/lab.conf.template:ro
      - ./infra/nginx/15-render.sh:/docker-entrypoint.d/15-render.sh:ro
    depends_on:
      app:
        condition: service_healthy
    ulimits:
      nofile:
        soft: ${NOFILE:-65536}
        hard: ${NOFILE:-65536}
    sysctls:
      net.core.somaxconn: ${SOMAXCONN:-4096}

  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9095}:9090"]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/prometheus/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:${GRAFANA_PORT:-3300}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-lab-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: [--nginx.scrape-uri=http://nginx:8081/stub_status]
    depends_on: [nginx]

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://observer:observer@postgres:5432/lab?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  nettools:
    profiles: [tools]
    build: infra/nettools
    network_mode: service:postgres
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: [./artifacts:/artifacts]
    entrypoint: []
    command: [sleep, infinity]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
