name: reliability-lab
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: make setup
      - run: make lint test
      - run: make up
      - run: make verify
      - run: make smoke
      - name: Save local verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-lab-evidence
          path: |
            results/
            artifacts/
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop lab
        if: always()
        run: docker compose down
